#
#
#           Welcome to Verse!
#
#
# This is your site.yml file.
# All of your metadata and content is kept alongside this file, and
# verse parses, assembles and formats the final site in htdocs/.
#
# To get started, you will probably want to change the title of
# your site, and maybe select a different style.
#

site:
  title:    My New Verse Site
  subtitle: some thoughts, some musings...
  author:   Your Name

  # Canonical URL of your site (used for metadata, not linking)
  canon:    http://example.com

  theme: default


  # Here you can tell Verse about your Social Media identities;
  # Verse will use this information when generating page metadata
  #id:
  #  facebook: https://www.facebook.com/YOURID
  #  twitter:  YOURID # minus the '@'

  # Meta tag defaults (used for Open Graph, Twitter Cards, etc.)
  # These provide fallbacks when content doesn't specify meta attributes
  #meta:
  #  default_description: "My personal blog about interesting topics"
  #  default_image: /images/og-default.jpg
  #  twitter:
  #    card: summary_large_image
  #    site: YOURID # minus the '@'
  #  facebook:
  #    app_id: 123456789
  #    author: https://www.facebook.com/YOURID

  # Sitemap defaults (for sitemap.xml generation)
  # Uncomment to customize priority and changefreq for different content types
  #sitemap:
  #  defaults:
  #    page:
  #      priority: 0.7
  #      changefreq: monthly
  #    article:
  #      priority: 0.8
  #      changefreq: weekly
  #    index:
  #      priority: 1.0
  #      changefreq: daily


# P.S. If you want to get started adding content to your site,
# you'll be interested in the files under data/:
#
#  - data/pages - Standalone pages (index, About, etc.)
#  - data/blog  - Articles in a weblog
#
# You can add sitemap and meta attributes to any content file:
#
#  sitemap:
#    priority: 0.9
#    changefreq: weekly
#    images:
#      - /images/my-image.jpg
#  meta:
#    description: "Custom description for this page"
#    image: /images/og-custom.jpg
#
# Happy Hacking!
# - The Verse Team
